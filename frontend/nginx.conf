server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API, matching the dev proxy — so the browser never makes a
    # cross-origin request and there is no API URL baked into the bundle.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The docs page reads the live OpenAPI spec, which FastAPI serves from the root rather than
    # under /api. Without this exact match nginx falls through to the SPA and hands back
    # index.html, which fails to parse as JSON and looks like the API being down.
    #
    # Deliberately not proxying /docs: FastAPI's Swagger UI lives there, but so does this app's
    # own documentation section, and the frontend route must win.
    location = /openapi.json {
        proxy_pass http://api:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed asset filenames are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths are React Router's to resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
