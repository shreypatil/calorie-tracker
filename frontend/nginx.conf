server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Same-origin API, matching the dev proxy — so the browser never makes a
    # cross-origin request and there is no API URL baked into the bundle.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed asset filenames are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing: unknown paths are React Router's to resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
