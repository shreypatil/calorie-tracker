[project]
name = "calorie-tracker-api"
version = "0.1.0"
description = "Personal Calorie Tracker — backend API"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "email-validator>=2.2",
    "pillow>=11.0",
    "pypdf>=5.1",
    "pdfplumber>=0.11",
]

# Real AI providers are optional on purpose: the app runs fully on the stub
# provider with no keys and no extra packages installed.
[project.optional-dependencies]
ai = [
    "anthropic>=0.40",
    "openai>=1.57",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Migrations are generated by Alembic; reformatting them adds churn with no benefit.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
