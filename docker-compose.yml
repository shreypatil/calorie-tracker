services:
  api:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: sqlite:////srv/data/calorie_tracker.db
      JWT_SECRET: dev-only-insecure-secret-change-me
      AI_PROVIDER: auto
      # Logs go to the named volume as well as stdout, so `docker compose logs` and the durable
      # file agree and neither is the only copy.
      LOG_DIR: /srv/logs
    volumes:
      # Named volumes so the database and the logs survive rebuilds.
      - api-data:/srv/data
      - api-logs:/srv/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
  api-logs:
